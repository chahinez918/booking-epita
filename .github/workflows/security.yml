name: security
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        with:
          scan-args: |-
            --format sarif
            --output DependenciesAnalysisFull.sarif
            ./
        continue-on-error: true
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-report
          path: DependenciesAnalysisFull.sarif

  sourcecode:
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: run semgrep
        run: semgrep --config .semgrep --sarif > semgrep.sarif || true
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourcecode-report
          path: semgrep.sarif
